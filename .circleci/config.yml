version: 2.1

orbs:
  architect: giantswarm/architect@10.4.0

workflows:
  test:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build
          binary: template
          architectures: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64"
          filters:
            # Trigger job also on git tag.
            tags:
              only: /^v.*/
      # - architect/push-to-registries:
      #     context: architect
      #     name: push-to-registries
      #     requires:
      #       - go-build
      #     filters:
      #       # Trigger job also on git tag.
      #       tags:
      #         only: /^v.*/
      #       branches:
      #         ignore:
      #           - main
      #           - master
      - architect/upload-release-assets:
          binary: logql-lint
          context: architect
          requires:
            - go-build
          filters:
            # Only run on git tag.
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
